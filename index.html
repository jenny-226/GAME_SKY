<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GAME SKY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body data-mode="menu">
  <canvas id="game"></canvas>

  <!-- 메인 메뉴 -->
  <section id="menu" class="screen">
    <div class="logo">GAME <span>SKY</span></div>
    <div class="world-tag">현재 월드 · <b id="worldName">-</b></div>
    <div class="menu-btns">
      <button id="btnStart" class="btn big cyan">주행 시작</button>
      <button id="btnGarage" class="btn">🚗 차고 (색상·모양)</button>
      <button id="btnWorld" class="btn">🌍 월드 선택</button>
    </div>
    <p class="hint">PC: 방향키/WASD · 모바일: 화면 버튼</p>
  </section>

  <!-- 월드 선택 -->
  <section id="worlds" class="screen">
    <div class="topbar"><button id="worldBack" class="back">↩</button><h2>월드 선택</h2></div>
    <div id="worldList"></div>
  </section>

  <!-- 차고 (자동차 선택) -->
  <section id="garage" class="screen">
    <div class="topbar">
      <button id="garageBack" class="back">↩</button>
      <div class="coins"><i>●</i><span id="coinCount">0</span><b>+</b></div>
    </div>
    <div class="panel-left">
      <div class="sel-title"><span class="ic">🚘</span><b>CARS</b><em>Selection</em></div>
      <div class="car-name"><span id="carName">Model 3</span><small id="carSub"></small></div>
      <div class="stat"><span>⏱</span><label>SPEED</label><div class="bar"><i id="statSpeed"></i></div></div>
      <div class="stat"><span>🛞</span><label>HANDLING</label><div class="bar"><i id="statHandling"></i></div></div>
      <div class="stat"><span>🛑</span><label>BRAKE</label><div class="bar"><i id="statBrake"></i></div></div>
    </div>
    <div class="panel-right">
      <button class="tool on" data-tab="paint"><span>🎨</span>Paint</button>
      <button class="tool" data-tab="shape"><span>⚙️</span>Shape</button>
    </div>
    <button id="prevCar" class="arrow left">«</button>
    <button id="nextCar" class="arrow right">»</button>
    <div class="tray">
      <div class="tray-paint">
        <div class="tray-label">PAINT · <span id="paintName">Pearl White</span></div>
        <div id="swatches"></div>
        <label class="custom">커스텀<input type="color" id="customColor" /></label>
      </div>
      <div class="tray-shape">
        <div class="opt-row"><span>모델</span><div id="modelDots"></div></div>
        <div class="opt-row"><span>휠</span><div id="optWheel"></div></div>
        <div class="opt-row"><span>스포일러</span><div id="optSpoiler"></div></div>
        <div class="opt-row"><span>차고</span><div id="optStance"></div></div>
      </div>
      <button id="btnDrive" class="btn cyan drive">🏁 DRIVE</button>
    </div>
  </section>

  <!-- 주행 HUD -->
  <section id="hud" class="screen">
    <div class="hud-top">
      <div class="hud-box"><small>LAP</small><b id="lap">1</b></div>
      <div class="hud-box"><small>TIME</small><b id="time">00:00.00</b></div>
      <div class="hud-box"><small>BEST</small><b id="best">--:--.--</b></div>
      <button id="btnPause" class="hud-pause">❚❚</button>
    </div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div class="speedo"><b id="speed">0</b><small>km/h</small><div class="sbar"><i id="speedBar"></i></div></div>
    <div class="touch">
      <div class="steer">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="pedals">
        <button data-key="brake" class="brake">BRAKE</button>
        <button data-key="gas" class="gas">GAS</button>
      </div>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="pause" class="screen">
    <h2>일시정지</h2>
    <button id="btnResume" class="btn big cyan">계속하기</button>
    <button id="btnRestart" class="btn">다시 시작</button>
    <button id="btnQuit" class="btn">메뉴로</button>
  </section>

  <div id="countdown"></div>
  <div id="toast"></div>
  <div id="loading"><div class="spin"></div>월드 불러오는 중…</div>

  <script type="module" src="main.js"></script>
</body>
</html>
